# Runs on every push and pull request. Windows comes first: the scripts are built for a Windows 365 Cloud PC.
name: check

# Pushes to main, and pull requests: a push to a pull request's branch would otherwise run everything twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # The lint and type-check tools need Node 22 or later.
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  # The scripts still run on Node 18; the tests need no install.
  test-node-18:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 18
      - run: node --test
